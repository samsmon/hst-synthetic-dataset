# Generator configuration. Every tunable number lives here, not in code.
# Rules and reasons are in docs/design.md.

seed: 42

# Total size. Either fix the total with target_tickets, or leave it null and
# calibrate from the monthly average of one year (the total follows).
# Use --tickets on the command line for small development runs.
target_tickets: null
calibration:
  years: [2022, 2025]            # the mature years, COVID and the opening are lower
  monthly_mean: 200000           # average per month over these years, months range about 175k to 230k

period:
  start: 2020-01-01
  end: 2025-12-31

routes:
  # route_id -> base share of tickets (route 1 Jakarta-Bandung, 2 Jakarta-Karawang, 3 Karawang-Bandung)
  base_share: {1: 0.60, 2: 0.15, 3: 0.25}
  monthly_drift_sigma: 0.05      # slow random change of the shares per month

# Same windows as sql/03_reference_data.sql (table covid_phase).
covid_phases:
  - {phase: pre,          start: 2019-12-01, end: 2020-02-29}
  - {phase: lockdown,     start: 2020-03-01, end: 2020-12-31}
  - {phase: restrictions, start: 2021-01-01, end: 2021-09-30}
  - {phase: recovery,     start: 2021-10-01, end: 2022-12-31}
  - {phase: normal,       start: 2023-01-01, end: 2025-12-31}

# Demand level relative to a mature network (1.0), interpolated linearly in log
# space between the knots. The operator opens in Dec 2019, so early 2020 is a
# ramp-up that COVID then cuts short.
regime_knots:
  - [2020-01-01, 0.30]
  - [2020-02-29, 0.42]
  - [2020-03-15, 0.28]
  - [2020-04-15, 0.12]
  - [2020-06-30, 0.10]
  - [2020-09-30, 0.18]
  - [2020-12-31, 0.22]
  - [2021-03-31, 0.30]
  - [2021-06-30, 0.30]
  - [2021-09-30, 0.34]
  - [2021-11-30, 0.60]
  - [2022-01-31, 0.82]
  - [2022-04-30, 1.00]
  - [2025-12-31, 1.00]

trend:
  start: 2022-01-01              # slow growth once the network is mature
  yearly_growth: 0.02

# Extra multipliers on top of the level (mudik bans and the Delta wave).
restriction_windows:
  - {name: mudik ban 2020,  start: 2020-04-24, end: 2020-06-07, factor: 0.40}
  - {name: mudik ban 2021,  start: 2021-05-06, end: 2021-05-17, factor: 0.35}
  - {name: delta wave 2021, start: 2021-07-03, end: 2021-08-02, factor: 0.40}

weekly: {mon: 0.95, tue: 0.85, wed: 0.85, thu: 0.92, fri: 1.25, sat: 1.15, sun: 1.15}

lebaran:
  dates: [2020-05-24, 2021-05-13, 2022-05-02, 2023-04-22, 2024-04-10, 2025-03-31]
  window_days: 7                 # H-7 .. H+7 counts as the Lebaran window
  outbound_peak: {offset: -3, height: 0.60, width: 2.5}
  return_peak:   {offset: 5,  height: 0.50, width: 2.5}
  holiday_dip: 0.70              # on Lebaran day and the day after

year_end:
  window: [[12, 20], [1, 3]]
  peaks:
    - {month: 12, day: 24, height: 0.40, width: 2.5}
    - {month: 12, day: 31, height: 0.45, width: 2.5}

school_holidays:                 # approximate, [month, day, month, day]
  - [6, 24, 7, 14]
  - [12, 21, 1, 4]
school_holiday_factor: 1.10
public_holiday_factor: 1.15      # fixed-date holidays only for now

noise:
  day_shock_sigma: 0.10          # shared by all routes on a day
  nb_size: 20                    # negative binomial size, larger = less noise

groups:
  share_range: [0.15, 0.35]      # random share of group tickets per month
  min_pax: 20
  # Where group tickets fall within a month (relative weights).
  weights: {school_holiday: 1.35, weekend: 0.85, weekday: 1.05, lebaran_window: 0.60, year_end: 0.80}

# ---------------------------------------------------------------- stage 2
# Position ids and station ids mirror sql/03_reference_data.sql.
employees:
  headcount_knots:               # target active employees at that date
    - [2019-12-01, 110]
    - [2020-02-29, 125]
    - [2020-12-31, 115]
    - [2021-12-31, 150]
    - [2022-06-30, 300]
    - [2022-12-31, 360]
    - [2023-12-31, 390]
    - [2024-12-31, 410]
    - [2025-12-31, 420]
  initial_hire_window: [2018-07-01, 2019-11-30]
  station_weights: {1: 0.34, 2: 0.12, 3: 0.16, 4: 0.38}      # Halim, Karawang, Padalarang, Tegalluar
  monthly_attrition: {contract: 0.018, permanent: 0.006}
  promotion: {min_tenure_months: 18, monthly_hazard: 0.008}
  transfer_monthly_hazard: 0.004
  min_tenure_for_vacancy_months: 12
  # share = share of non-singleton headcount; singleton: per_station or hq (exactly one holder)
  # next = promotion target; supervisor = position of the supervisor at the same station (or hq)
  positions:
    - {id: 1,  share: 0.26, station_based: true,  next: 2,    supervisor: 3,    contract_share: 0.40}
    - {id: 2,  share: 0.07, station_based: true,  next: 3,    supervisor: 3,    contract_share: 0.05}
    - {id: 3,  share: 0.03, station_based: true,  next: 4,    supervisor: 4,    contract_share: 0.02}
    - {id: 4,  singleton: hq,          station_based: false, next: null, supervisor: null, contract_share: 0.0}
    - {id: 5,  share: 0.20, station_based: true,  next: 6,    supervisor: 6,    contract_share: 0.40}
    - {id: 6,  share: 0.04, station_based: true,  next: 7,    supervisor: 7,    contract_share: 0.02}
    - {id: 7,  singleton: per_station, station_based: true,  next: null, supervisor: null, contract_share: 0.0}
    - {id: 8,  share: 0.15, station_based: true,  next: 9,    supervisor: 9,    contract_share: 0.40}
    - {id: 9,  share: 0.03, station_based: true,  next: null, supervisor: 7,    contract_share: 0.02}
    - {id: 10, share: 0.06, station_based: true,  stations: {1: 0.5, 4: 0.5}, next: 11, supervisor: 11, contract_share: 0.10}
    - {id: 11, singleton: hq,          station_based: false, next: null, supervisor: null, contract_share: 0.0}
    - {id: 12, share: 0.05, station_based: false, next: 14,   supervisor: 15,   contract_share: 0.05}
    - {id: 13, share: 0.06, station_based: false, next: 14,   supervisor: 14,   contract_share: 0.05}
    - {id: 14, share: 0.03, station_based: false, next: 15,   supervisor: 15,   contract_share: 0.02}
    - {id: 15, singleton: hq,          station_based: false, next: null, supervisor: null, contract_share: 0.0}

companies:
  count: 4000
  type_share: {travel_agency: 0.30, corporate: 0.25, school: 0.25, government: 0.10, community: 0.10}
  joined_range: [2019-12-01, 2025-09-30]
  activity_sigma: 1.1            # lognormal spread of how often a company books
  late_probability: {travel_agency: 0.15, corporate: 0.10, school: 0.30, government: 0.45, community: 0.25}
  mean_pay_lag_days: {travel_agency: 5, corporate: 12, school: 20, government: 35, community: 15}

promos:
  monthly_deal:
    count_probs: [0.30, 0.50, 0.20]                 # 0, 1 or 2 deals per month
    audience: {group: 0.50, all: 0.30, individual: 0.20}
    discount_group: [10, 15, 20, 25]
    discount_other: [5, 10, 15, 20, 25, 30]
    discount_other_weights: [0.25, 0.25, 0.20, 0.15, 0.10, 0.05]
    min_pax: {20: 0.50, 30: 0.30, 50: 0.20}
    duration_days: [7, 31]
    route_limited_share: 0.20
  anniversary: {duration_days: 7, discounts: [15, 20, 25]}
  seasonal: {months_per_year: 2, discounts: [10, 15, 20]}
  loyalty: {discount_until_2022: 10, discount_from_2023: 12}

trips:
  seat_capacity: {300: 0.25, 450: 0.25, 600: 0.50}
  target_load_factor: 0.70       # used to decide how many runs a day needs
  max_load_factor: 0.95          # never plan more tickets than this share of seats
  min_trips_per_direction: 2
  max_trips_per_direction: 32
  first_departure_minute: 360    # 06:00
  last_departure_minute: 1230    # 20:30
  duration_minutes: 47
  to_bandung_share: {mon: 0.50, tue: 0.50, wed: 0.50, thu: 0.50, fri: 0.56, sat: 0.52, sun: 0.44}

# ---------------------------------------------------------------- stage 3
# Sales channel ids mirror sql/03_reference_data.sql: 1 COUNTER, 2 GROUP, 3 FCC, 4 AGENT, 5 APP, 6 WEB.
stage3:
  as_of: 2025-12-31                      # tickets departing after this date would be 'issued', not 'used'
  pending:
    last_days: 60                        # bookings departing in the last N days stay pending
    random_share: 0.015                  # plus this share of older bookings
  stations:
    far_end_share: {pdl: 0.35, tgl: 0.65}     # Padalarang vs Tegalluar on routes that reach Bandung
    offset_minutes: {1: 0, 2: 17, 3: 34, 4: 47}   # minutes from Halim, along the corridor
  group:
    size: {min: 20, max: 120, lognormal_mu: 2.9, lognormal_sigma: 0.75}   # passengers = min + lognormal
    date_count_probs: {1: 0.60, 2: 0.35, 3: 0.05}
    date_gap_days: [1, 3]
    first_leg_to_bandung: 0.55
    lead_days: {median: 28, sigma: 0.6, min: 4, max: 120}
    purchase_offset_days: [0, 3]
    due_days_after_document: 14
    seat_class: {economy: 0.70, premium: 0.15, business: 0.12, first: 0.03}
    channel: {2: 0.70, 4: 0.30}
    tier_discount_pct: [[20, 3.0], [30, 6.0], [60, 9.0]]
    counterparty_variants: {exact: 0.85, upper: 0.10, short: 0.05}
  individual:
    seat_class: {economy: 0.55, premium: 0.15, business: 0.22, first: 0.08}
    commuter_seat_class: {economy: 0.75, premium: 0.12, business: 0.11, first: 0.02}
    channel_by_year:                      # shares of non-card individual tickets
      2020: {1: 0.50, 4: 0.10, 5: 0.15, 6: 0.25}
      2021: {1: 0.42, 4: 0.10, 5: 0.22, 6: 0.26}
      2022: {1: 0.36, 4: 0.10, 5: 0.30, 6: 0.24}
      2023: {1: 0.30, 4: 0.10, 5: 0.38, 6: 0.22}
      2024: {1: 0.28, 4: 0.10, 5: 0.41, 6: 0.21}
      2025: {1: 0.26, 4: 0.10, 5: 0.44, 6: 0.20}
    lead_days_mean: {1: 1.0, 3: 2.0, 4: 8.0, 5: 5.0, 6: 6.0}     # exponential mean per channel
    early_bird_pct: [[30, 3.0], [14, 1.5]]
  customers:
    segment_share: {commuter: 0.35, occasional: 0.45, one_time: 0.20}   # of individual tickets
    commuter_trips_per_month: 9
    commuter_monthly_churn: 0.012
    commuter_weight_sigma: 0.5
    commuter_fcc_share: 0.40             # commuters who hold a card
    fcc_ticket_share: 0.90               # their tickets bought with the card
    occasional_new_share: 0.25           # chance an occasional ticket belongs to a first-time customer
    foreign_share: 0.03
    age: {mean: 33, sd: 11, min: 17, max: 70}
  pricing:
    demand_discount: {reference_load: 0.80, pct_per_load_point: 40.0, max_pct: 12.0}
    peak_uplift: {from_load: 0.75, full_at_load: 0.95, max: 0.15}
    max_discount_pct: 40.0
    service_fee: {1: 0, 2: 0, 3: 0, 4: 5000, 5: 2500, 6: 2500}
    payment_method:
      1: {cash: 0.35, debit_card: 0.30, credit_card: 0.10, qris: 0.25}
      2: {bank_transfer: 1.0}
      3: {fcc_quota: 1.0}
      4: {bank_transfer: 0.60, agent_deposit: 0.40}
      5: {e_wallet: 0.45, virtual_account: 0.25, credit_card: 0.15, qris: 0.15}
      6: {virtual_account: 0.40, credit_card: 0.25, e_wallet: 0.25, bank_transfer: 0.10}
  staff_roles:                            # job_position ids allowed to issue per channel
    1: [1, 2, 3]
    2: [10]
    3: [8]

# ---------------------------------------------------------------- stage 4
stage4:
  fcc:
    type_share: {G: 0.65, S: 0.35}       # type G (quota 10, valid 60d), S (quota 6, valid 30d)
    validity_days: {G: 60, S: 30}
    quota: {G: 10, S: 6}
  refunds:
    normal_cancel_rate: [0.02, 0.04]     # 2 to 4 percent cancelled normally
    lockdown_refund_rate: [0.15, 0.25]   # March-June 2020 for tickets bought before March 2020
    lockdown_window: ["2020-03-01", "2020-06-30"]
    group_cancel_rate: 0.005             # small share only for group tickets
    refund_share: 0.65                   # share of cancelled that become refunded vs cancelled (no refund row)
    reasons:
      customer_request:  {share: 0.55, fee_pct: 0.25}
      schedule_change:   {share: 0.25, fee_pct: 0.00}
      illness:           {share: 0.10, fee_pct: 0.25}
      duplicate_booking: {share: 0.05, fee_pct: 0.00}
      other:             {share: 0.05, fee_pct: 0.25}
    online_cs_processed_share: 0.10      # 90% online refunds have NULL employee, 10% handled by CS
  bank:
    operator_accounts: ["1010001234567", "1010007654321"]
    opening_balances: {"1010001234567": 25000000000.0, "1010007654321": 15000000000.0}
    account_shares: {"1010001234567": 0.60, "1010007654321": 0.40}
    patterns:
      full: 0.60
      deposit_final: 0.25
      instalments: 0.10
      multi_booking: 0.05
    deposit_pct_range: [0.20, 0.50]
    instalment_counts: [3, 4]
    monthly_fees: {"1010001234567": 150000.0, "1010007654321": 120000.0}
    monthly_interest_rate: 0.0015
    sender_banks: ["BCA", "Mandiri", "BRI", "BNI", "CIMB Niaga", "Permata", "BSI"]
    sender_name_variants: {exact: 0.70, upper: 0.15, short: 0.10, typo: 0.05}
    message_variants: {standard: 0.70, abbreviated: 0.15, typo: 0.10, empty: 0.05}

